name: Force hotspot runtime fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  force-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force optional retired Caveman listener
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('openCavemanBot.addEventListener', 'openCavemanBot?.addEventListener')
          path.write_text(text, encoding='utf-8')
          if 'openCavemanBot?.addEventListener' not in text:
              raise SystemExit('runtime listener was not patched')
          PY
          grep -n "openCavemanBot" app.js
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit forced runtime fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.js
            git commit -m "Force hotspot startup runtime fix"
            git push
          fi
