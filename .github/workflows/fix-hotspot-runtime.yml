name: Fix hotspot runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make retired Caveman button listener optional
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('els.openCavemanBot.addEventListener("click", () => {', 'els.openCavemanBot?.addEventListener("click", () => {')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit runtime fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.js
            git commit -m "Fix hotspot startup after retiring caveman tab"
            git push
          fi
